services:
  postgres:
    image: postgres:17
    container_name: administrapochi-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: pochidb
      POSTGRES_USER: pochiadmin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
